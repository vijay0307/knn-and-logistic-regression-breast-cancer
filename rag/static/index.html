<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classifier Docs Chat</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --border:#e2e2dd; --accent:#2f5d8a; --user:#e9f0f7; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ecece8; --muted:#a0a09a; --border:#33332f; --accent:#7fb0e0; --user:#22303d; --warn:#e0b060; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  .note { color:var(--warn); font-size:13px; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { background:var(--user); align-self:flex-end; max-width:85%; }
  .cites { margin-top:8px; font-size:13px; color:var(--muted); }
  .cites details { margin-top:4px; }
  .fb { margin-top:6px; display:flex; gap:6px; }
  .fb button { font-size:13px; padding:2px 8px; }
  form { display:flex; gap:8px; margin-top:12px; position:sticky; bottom:0; background:var(--bg); padding:8px 0; }
  input, textarea, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  textarea { flex:1; resize:vertical; min-height:44px; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #key { width:200px; max-width:100%; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Classifier docs assistant</h1>
    <div><a href="/dashboard" style="color:var(--accent);margin-right:10px">Dashboard</a><input id="key" type="password" placeholder="API key" autocomplete="off" aria-label="API key"></div>
  </header>
  <div class="note">Answers come only from the project documentation. Educational demo, not medical advice.</div>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="q" maxlength="2000" placeholder="e.g. Why does KNN need feature scaling?" aria-label="Question" required></textarea>
    <button class="primary" id="send">Ask</button>
  </form>
</main>
<script>
// All model/document text is inserted with textContent, never innerHTML (prevents XSS).
const log = document.getElementById('log'), keyEl = document.getElementById('key');
const history = [];
try { keyEl.value = sessionStorage.getItem('rag_key') || ''; } catch {}
keyEl.addEventListener('change', () => { try { sessionStorage.setItem('rag_key', keyEl.value); } catch {} });

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(role, text) { const m = el('div', 'msg ' + role, text); log.appendChild(m); m.scrollIntoView({block:'end'}); return m; }
function headers() { return {'content-type':'application/json', 'authorization':'Bearer ' + keyEl.value}; }

document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const qEl = document.getElementById('q'), q = qEl.value.trim(); if (!q) return;
  qEl.value = ''; add('user', q);
  const m = add('bot', 'Thinking…'); const btn = document.getElementById('send'); btn.disabled = true;
  try {
    const r = await fetch('/chat', {method:'POST', headers:headers(), body:JSON.stringify({question:q, history:history.slice(-12)})});
    const d = await r.json();
    if (!r.ok) { m.textContent = 'Error ' + r.status + ': ' + (typeof d.detail === 'string' ? d.detail : 'invalid request'); return; }
    m.textContent = d.answer;
    history.push({role:'user', content:q}, {role:'assistant', content:d.answer});
    if (d.citations.length) {
      const c = el('div', 'cites', 'Sources:');
      for (const s of d.citations) { const det = el('details'); det.appendChild(el('summary', null, s.source + ' › ' + s.section)); det.appendChild(el('div', null, s.snippet + '…')); c.appendChild(det); }
      m.appendChild(c);
    }
    const fb = el('div', 'fb');
    for (const [label, rating] of [['👍','up'],['👎','down']]) {
      const b = el('button', null, label); b.type = 'button'; b.setAttribute('aria-label', rating === 'up' ? 'Helpful' : 'Not helpful');
      b.onclick = async () => { fb.textContent = 'Thanks for the feedback.'; await fetch('/chat/feedback', {method:'POST', headers:headers(), body:JSON.stringify({response_id:d.response_id, rating, question:q, answer:d.answer})}); };
      fb.appendChild(b);
    }
    m.appendChild(fb);
  } catch (err) { m.textContent = 'Network error.'; }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
