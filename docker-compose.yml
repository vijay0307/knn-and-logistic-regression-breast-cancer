# One command brings up: API + Prometheus (scrapes /metrics) + Grafana (dashboards)
#   docker compose up --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000  (admin / admin)
#   RAG chat   http://localhost:8100      (needs .env, see rag/README.md)
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/srv/data"]          # prediction log survives restarts
  rag:
    build: {context: ., dockerfile: Dockerfile.rag}
    ports: ["8100:8100"]
    env_file: [.env]                       # ANTHROPIC_API_KEY=..., RAG_API_KEYS=... (never commit .env)
    environment: {CLASSIFIER_URL: "http://api:8000", RAG_REPORT_DIR: /srv/reports}   # dashboard pulls classifier metrics
    volumes: ["./data:/srv/data", "./reports:/srv/reports:ro"]   # eval reports feed /dashboard
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/datasources
