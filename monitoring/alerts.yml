# Real-time OPERATIONAL alerts (is the service healthy?). Statistical drift and
# accuracy are checked by monitoring/monitor.py on a schedule instead.
groups:
  - name: classifier-api
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(predict_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
      - alert: HighErrorRate
        expr: sum(rate(predict_requests_total{status!="ok"}[5m])) / sum(rate(predict_requests_total[5m])) > 0.05
        for: 5m
      - alert: LowModelConfidence
        # median max-probability falling = model sees inputs unlike its training data
        expr: histogram_quantile(0.5, sum(rate(prediction_confidence_bucket[1h])) by (le)) < 0.7
        for: 30m
      - alert: ApiDown
        expr: up{job="classifier-api"} == 0
        for: 1m
  - name: rag-chatbot
    rules:
      - alert: RagDown
        expr: up{job="rag-chatbot"} == 0
        for: 1m
      - alert: RagUpstreamErrors
        expr: sum(rate(rag_requests_total{outcome=~"upstream_error|upstream_rate_limited|internal_error"}[5m])) / sum(rate(rag_requests_total[5m])) > 0.05
        for: 5m
      - alert: RagInjectionSpike
        # sudden burst of blocked prompts = someone probing the bot
        expr: sum(rate(rag_requests_total{outcome="prompt_injection"}[10m])) * 600 > 20
        for: 5m
      - alert: RagHighNoAnswerRate
        # bot says "I don't know" a lot = docs are missing content users need
        expr: sum(rate(rag_requests_total{outcome="no_answer"}[1h])) / sum(rate(rag_requests_total[1h])) > 0.3
        for: 1h
      - alert: RagNegativeFeedback
        expr: sum(increase(rag_feedback_total{rating="down"}[1d])) / sum(increase(rag_feedback_total[1d])) > 0.3
        for: 1h
